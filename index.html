<!DOCTYPE html>
<html lang="ny">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Music Share</title>

<style>
body{
background:#0a0a0a;
color:white;
font-family:Arial;
padding:20px;
margin:0;
}

.container{
max-width:700px;
margin:auto;
}

h1{
color:#00c853;
text-align:center;
}

.upload-box{
background:#1a1a1a;
padding:20px;
border-radius:12px;
border:2px solid #00c853;
margin:20px 0;
}

input,button{
width:100%;
padding:12px;
margin:8px 0;
border-radius:8px;
border:1px solid #333;
background:#222;
color:white;
font-size:16px;
}

button{
background:#00c853;
font-weight:bold;
cursor:pointer;
}

button:disabled{
background:#555;
}

.song{
background:#1e1e1e;
padding:15px;
margin:10px 0;
border-radius:10px;
border-left:4px solid #00c853;
}

#status{
text-align:center;
color:#00c853;
}
</style>

</head>


<body>

<div class="container">

<h1>🎵 Music Share</h1>

<p style="text-align:center;color:#aaa">
By Austin Jere
</p>


<div class="upload-box">

<h3>⬆ Kwezani Nyimbo</h3>

<input type="text" id="artist" placeholder="Dzina la Woyimba">

<input type="text" id="songName" placeholder="Dzina la Nyimbo">

<input type="file" id="fileInput" accept="audio/*">

<button id="uploadBtn">
Kwezani Tsopano
</button>

<p id="status"></p>

</div>


<div id="playlist"></div>


</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
"https://qctohxrluncojcsdfpvd.supabase.co";


const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFjdG9oeHJsdW5jb2pjc2RmcHZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5MjEyNzIsImV4cCI6MjEwMDQ5NzI3Mn0.lMDWHk9IP7cOnnD40cjaOwRYIv7BlCGcRO0e7mYKmFI";


const client = supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);



document.getElementById("uploadBtn")
.addEventListener("click",uploadSong);



async function uploadSong(){


const artist =
document.getElementById("artist").value;


const songName =
document.getElementById("songName").value;


const file =
document.getElementById("fileInput").files[0];


const status =
document.getElementById("status");


const btn =
document.getElementById("uploadBtn");



if(!artist || !songName || !file){

status.innerText="⚠️ Dzazani zonse";

return;

}



btn.disabled=true;

status.innerText="⏳ Ikukweza...";



try{


const fileName =
Date.now()+"-"+file.name;



const {error:uploadError} =
await client.storage
.from("songs")
.upload(fileName,file);



if(uploadError)
throw uploadError;




const {data} =
client.storage
.from("songs")
.getPublicUrl(fileName);





const {error:dbError} =
await client
.from("songs")
.insert({

artist:artist,

title:songName,

file_url:data.publicUrl

});



if(dbError)
throw dbError;



status.innerText="✅ Yakwezedwa bwino!";


document.getElementById("artist").value="";

document.getElementById("songName").value="";

document.getElementById("fileInput").value="";


loadSongs();



}

catch(err){

status.innerText="❌ Vuto: "+err.message;

console.log(err);

}


btn.disabled=false;


}




async function loadSongs(){


const {data,error} =
await client
.from("songs")
.select("*")
.order("id",{ascending:false});



let html =
"<h2 style='color:#00c853'>Playlist</h2>";



if(error){

html+="<p>Vuto potenga nyimbo</p>";

}



else if(!data || data.length===0){

html+="<p style='color:#777'>Palibe nyimbo pano</p>";

}



else{


data.forEach(song=>{


html+=`

<div class="song">

<b style="color:#00c853">
${song.artist}
</b>

<br>

${song.title}

<br><br>

<audio controls src="${song.file_url}">
</audio>

<br><br>

<a href="${song.file_url}" 
style="color:#00c853">
Download
</a>


</div>

`;


});


}



document.getElementById("playlist").innerHTML=html;


}



loadSongs();


</script>


</body>
</html>
