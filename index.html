<!DOCTYPE html>
<html lang="ny">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Share - AUSTIN</title>
<style>
*{ margin:0; padding:0; box-sizing:border-box; }
body{ background:linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%); color:white; font-family:Arial, sans-serif; padding:20px; min-height:100vh; }
.container{ max-width:800px; margin:0 auto; }
h1{ color:#00c853; text-align:center; margin-bottom:10px; font-size:2.5em; }
.subtitle{ text-align:center; color:#aaa; margin-bottom:30px; }
.upload-box{ background:#1a1a1a; padding:25px; border-radius:15px; margin-bottom:30px; border:2px solid #00c853; }
.upload-box h3{ color:#00c853; margin-bottom:15px; }
input{ width:100%; padding:12px; margin:8px 0; border-radius:8px; border:1px solid #333; background:#222; color:white; font-size:16px; }
input::placeholder{ color:#777; }
button{ background:#00c853; color:white; padding:14px; border:none; width:100%; border-radius:8px; font-size:16px; font-weight:bold; cursor:pointer; margin-top:10px; }
button:hover{ background:#00e676; }
button:disabled{ background:#555; cursor:not-allowed; }
#status{ text-align:center; color:#00c853; margin-top:10px; font-weight:bold; }
.song{ background:#1e1e1e; padding:20px; margin:15px 0; border-radius:12px; border-left:4px solid #00c853; }
.song b{ font-size:18px; color:#00c853; }
.song audio{ width:100%; margin:12px 0; }
.download{ color:#00c853; text-decoration:none; font-weight:bold; display:inline-block; padding:8px 15px; background:#222; border-radius:6px; }
.download:hover{ background:#333; }
#playlist h2{ margin-bottom:15px; color:#00c853; }
.empty{ text-align:center; color:#777; padding:40px; }
</style>
</head>
<body>
<div class="container">
<h1>🎵 Music Share</h1>
<p class="subtitle">Austin Jere</p>
<div class="upload-box">
<h3>⬆ Upload Music</h3>
