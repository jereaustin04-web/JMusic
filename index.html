<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Austin Music</title>
<style>
body{background:#000;color:#fff;font-family:sans-serif;padding:10px}
.header{background:#1DB954;padding:20px;text-align:center;border-radius:10px}
.box{background:#111;padding:15px;margin:10px 0;border-radius:8px}
input,button{width:100%;padding:12px;margin:5px 0;border:none;border-radius:5px}
button{background:#1DB954;color:#fff;font-weight:bold;cursor:pointer}
audio{width:100%;margin:5px 0}
.song{background:#222;padding:10px;margin:8px 0;border-radius:8px}
.link{font-size:11px;color:#1DB954;word-break:break-all}
.comment-box{background:#333;padding:8px;margin:5px 0;border-radius:5px;font-size:13px}
.comment-input{display:flex}
.comment-input input{flex:1}
.comment-input button{width:90px}
</style>
</head>
<body>
<div class="header"><h1>🎵 AUSTIN MUSIC</h1></div>

<div class="box">
<h3>ADMIN</h3>
<input id="p" type="password" placeholder="Lowetsani Password">
<button onclick="login()">LOWA</button>
<p id="m" style="color:#1DB954"></p>
</div>

<div class="box">
<h3>UPLOAD</h3>
<input id="n" placeholder="Dzina Lako">
<input id="t" placeholder="Dzina la Nyimbo">
<input id="f" type="file" accept="audio/*">
<button onclick="uploadSong()">POST</button>
<p id="s" style="color:orange"></p>
</div>

<div class="box">
<h3>PLAYLIST</h3>
<div id="l">Loading...</div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyCGi6GlZJXxWInCJ_XTTvCxnkYSW3K6_og",databaseURL:"https://my-music-433b4-default-rtdb.firebaseio.com"});
var db=firebase.database(),admin=false;
var ADMIN_PASS = "Austin2026";

function login(){
  if(document.getElementById("p").value==ADMIN_PASS){
    admin=true; document.getElementById("m").innerText="Walowa Admin"; load();
  }else{alert("Password yolakwika")}
}

function uploadSong(){
  var file=document.getElementById("f").files[0],n=document.getElementById("n").value,t=document.getElementById("t").value;
  if(!n||!t||!file){alert("Lembani zonse");return}
  document.getElementById("s").innerText="Ikukweza...";
  var fd=new FormData();fd.append("file",file);fd.append("upload_preset","music_app");fd.append("resource_type","auto");
  fetch("https://api.cloudinary.com/v1_1/o1pg5jvm/auto/upload",{method:"POST",body:fd})
.then(res=>res.json()).then(data=>{
    db.ref("songs").push({name:t,url:data.secure_url,user:n,likes:0,comments:{}});
    alert("Yatha: "+t); document.getElementById("s").innerText="Watha!";
    document.getElementById("n").value=""; document.getElementById("t").value=""; document.getElementById("f").value="";
  }).catch(err=>alert("VUTO LA CLOUDINARY: "+err));
}

function delSong(k){if(confirm("Chotsa?"))db.ref("songs/"+k).remove()}
function likeSong(k){db.ref("songs/"+k+"/likes").transaction(function(c){return (c||0)+1})}
function copyLink(url){navigator.clipboard.writeText(url);alert("Link yakopedwa!")}
function addComment(k){
  var txt = document.getElementById("com_"+k).value;
  var user = document.getElementById("n").value || "Guest";
  if(!txt){alert("Lembani comment");return}
  db.ref("songs/"+k+"/comments").push({user:user,text:txt});
  document.getElementById("com_"+k).value="";
}

function load(){
  db.ref("songs").on("value",function(snap){
    var h=""; snap.forEach(function(c){
      var x=c.val();
      var shortUrl = x.url.substring(0,50)+"...";
      var b = admin? '<button onclick="delSong(\''+c.key+'\')" style="background:red">Delete</button>' : '';
      var comments = "";
      if(x.comments){ for(var key in x.comments){ comments += '<div class="comment-box"><b>'+x.comments[key].user+':</b> '+x.comments[key].text+'</div>'; }}
      h = '<div class="song"><h4>'+x.name+'</h4><p style="color:#aaa">By:'+x.user+'</p><audio controls src="'+x.url+'"></audio><div class="link">🔗 '+shortUrl+'</div><button onclick="copyLink(\''+x.url+'\')" style="background:orange;color:#000">📋 Koperani Link</button><button onclick="likeSong(\''+c.key+'\')">❤️ '+(x.likes||0)+'</button><div><h5>Comments</h5>'+comments+'<div class="comment-input"><input id="com_'+c.key+'" placeholder="Lembani comments Apa"><button onclick="addComment(\''+c.key+'\')">Tumiza</button></div></div>'+b+'</div>' + h;
    });
    document.getElementById("l").innerHTML=h||"Palibe nyimbo";
  });
}
load()
</script>
</body>
</html>
