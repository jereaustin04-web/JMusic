<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Austin Music Community</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#121212;color:white;font-family:Arial;padding:15px}
.header{text-align:center;margin-bottom:20px}
.header h1{color:green;font-size:24px}
.box{background:#181818;padding:15px;border-radius:12px;margin-bottom:15px;border:1px solid #333}
.btn{background:green;color:white;padding:16px;width:100%;border:none;border-radius:10px;font-size:18px;font-weight:bold;cursor:pointer;margin-top:8px}
.btn:hover{background:#00ff00;color:#000}
#searchBox{width:100%;padding:12px;background:#282828;color:white;border:1px solid green;border-radius:8px;font-size:16px;margin-bottom:10px}
.song{background:#282828;padding:12px;margin:8px 0;border-radius:10px}
.song-info h4{color:lightgreen;font-size:15px}
.song-info p{font-size:12px;color:gray;margin-bottom:5px}
audio{width:100%;margin-top:5px;height:35px}
input[type="file"]{display:none}
input[type="text"]{width:100%;padding:10px;background:#282828;color:white;border:1px solid #444;border-radius:8px;margin-bottom:8px}
</style>
</head>
<body>

<div class="header">
<h1>🎵 AUSTIN MUSIC COMMUNITY</h1>
<p>Upload and listen to music from everyone</p>
</div>

<div class="box">
<h3>📤 UPLOAD YOUR SONG</h3>
<input type="text" id="uploaderName" placeholder="Your name">
<label for="fileInput" class="btn">CHOOSE SONG TO UPLOAD</label>
<input type="file" id="fileInput" accept="audio/*">
<p id="uploadStatus" style="color:gray;text-align:center;margin-top:10px"></p>
</div>

<div class="box">
<h3>📻 COMMUNITY PLAYLIST</h3>
<input type="text" id="searchBox" placeholder="Search songs..." onkeyup="searchSongs()">
<div id="playlist"><p style="color:gray;text-align:center">Loading songs...</p></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<script>
// FIREBASE CONFIG YAKO
const firebaseConfig = {
  apiKey: "AIzaSyCGi6GlZJXxWInCJ_XTTvCxnkYSW3K6_og",
  databaseURL: "https://my-music-433b4-default-rtdb.firebaseio.com",
  projectId: "my-music-433b4"
};
firebase.initializeApp(firebaseConfig);

const db = firebase.database();

// UPLOAD KU CLOUDINARY
document.getElementById("fileInput").onchange = async (e) => {
    const file = e.target.files[0];
    const name = document.getElementById("uploaderName").value;

    if(!name){ alert("Please enter your name first"); return; }
    if(!file){ return; }

    document.getElementById("uploadStatus").innerText = "UPLOADING... Please wait";

    const formData = new FormData();
    formData.append('file', file);
    formData.append('upload_preset', 'music_app');
    formData.append('folder', 'community_music');

    const res = await fetch('https://api.cloudinary.com/v1_1/o1pg5jvm/auto/upload', {
        method: 'POST',
        body: formData
    });
    const data = await res.json();

    const newSong = {
        name: file.name.replace(/\.[^/.]+$/, ""),
        url: data.secure_url,
        user: name,
        date: new Date().toLocaleDateString()
    };
    db.ref("songs").push(newSong);

    alert("✅ Uploaded: " + newSong.name);
    document.getElementById("uploadStatus").innerText = "Upload complete!";
    document.getElementById("fileInput").value = "";
}

// WERENGANI NYIMBO ZONSE
function loadSongs(){
    db.ref("songs").on("value", snapshot => {
        const playlist = document.getElementById("playlist");
        playlist.innerHTML = "";
        if(!snapshot.exists()){
            playlist.innerHTML = "<p style='color:gray;text-align:center'>No songs yet. Be the first!</p>";
            return;
        }
        snapshot.forEach(child => {
            const song = child.val();
            playlist.innerHTML = `
            <div class="song" data-name="${song.name.toLowerCase()}">
                <div class="song-info">
                    <h4>${song.name}</h4>
                    <p>By: ${song.user} | ${song.date}</p>
                    <audio controls src="${song.url}"></audio>
                </div>
            </div>` + playlist.innerHTML;
        });
    });
}
loadSongs();

function searchSongs(){
    let input = document.getElementById('searchBox').value.toLowerCase();
    document.querySelectorAll('.song').forEach(song => {
        song.style.display = song.dataset.name.includes(input)? "block" : "none";
    });
}
</script>
</body>
</html>
