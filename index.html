<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Austin Music - Nyimbo Zaulere Ku Malawi 2026</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:'Poppins',sans-serif}
.header{background:linear-gradient(90deg,#1DB954 0%,#1ed760 100%);padding:10px 15px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}
.logo{width:40px;height:40px;border-radius:50%;border:2px solid #fff;object-fit:cover}
.main-container{display:flex;max-width:1200px;margin:0 auto;gap:15px;padding:15px}
.sidebar-left{width:250px;position:sticky;top:70px;height:fit-content}
.menu-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;margin:5px 0;cursor:pointer;background:#181818}
.menu-item.active{background:#1DB954;color:#000;font-weight:700}
.content{flex:1;max-width:600px}
.box{background:#181818;padding:15px;margin:12px 0;border-radius:12px}
.box h3{color:#1DB954;margin-bottom:12px}
input,textarea{width:100%;padding:12px;margin:6px 0;border:none;border-radius:8px;background:#282828;color:#fff;font-family:'Poppins'}
textarea{resize:none;height:80px}
button{width:100%;padding:12px;margin:6px 0;border:none;border-radius:8px;background:linear-gradient(90deg,#1DB954 0%,#1ed760 100%);color:#000;font-weight:700;cursor:pointer}
.song{display:flex;gap:10px;background:#282828;padding:10px;margin:10px 0;border-radius:10px}
.cover{width:70px;height:70px;border-radius:8px;object-fit:cover}
.audio-btns{display:flex;gap:5px;margin:6px 0}
.audio-btns button{flex:1;font-size:11px;padding:8px}
.btn-download{background:orange!important}
.btn-like{background:#ff0066!important}
.btn-link{background:#0088ff!important}
.btn-share{background:#25D366!important}
.desc{color:#aaa;font-size:12px;margin:4px 0;line-height:1.4}
@media(max-width:900px){.sidebar-left{display:none}.main-container{padding:10px} }
</style>
</head>
<body>
<div class="header">
<img src="https://i.imgur.com/2106523956891220.jpg" class="logo" alt="Logo">
<h1>🎵 Austin Music</h1>
</div>

<div class="main-container">
<div class="sidebar-left">
<div class="menu-item active" onclick="showTab('home')">🏠 Home</div>
<div class="menu-item" onclick="showTab('music')">🎵 Music</div>
</div>

<div class="content">
<div id="home-tab" class="tab">
<div class="box">
<h3>🎉 Welcome ku Austin Music</h3>
<p style="color:#aaa;font-size:14px">Tsitsani nyimbo zatsopano zaku Malawi zaulere.</p>
</div>

<div class="box">
<h3>⬆️ UPLOAD NYIMBO</h3>
<input id="n" placeholder="Dzina Lako">
<input id="t" placeholder="Dzina la Nyimbo">
<!-- DESCRIPTION YATSOPANO -->
<textarea id="d" placeholder="Lembani Description ya nyimbo... Mwachitsanzo: Nyimbo yachikondi yatsopano"></textarea>
<input id="f" type="file" accept="audio/*">
<button onclick="uploadSong()">POST NYIMBO</button>
<p id="s" style="color:orange;text-align:center"></p>
</div>

<div class="box">
<h3>🎧 PLAYLIST</h3>
<input id="search" placeholder="Fufuzani nyimbo..." onkeyup="searchSongs()">
<div id="l">Loading...</div>
</div>
</div>

<div id="music-tab" class="tab" style="display:none">
<div class="box"><h3>🎵 Nyimbo Zonse</h3><div id="l2">Loading...</div></div>
</div>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyCGi6GlZJXxWInCJ_XTTvCxnkYSW3K6_og",databaseURL:"https://my-music-433b4-default-rtdb.firebaseio.com"});
var db=firebase.database();
var allSongs = [];

function showTab(tab){
document.querySelectorAll('.tab').forEach(t=>t.style.display='none');
document.querySelectorAll('.menu-item').forEach(m=>m.classList.remove('active'));
event.target.classList.add('active');
document.getElementById(tab+'-tab').style.display='block';
if(tab=='music'){displaySongs(allSongs,'l2')}else{displaySongs(allSongs,'l')}
}

function uploadSong(){
var file=document.getElementById("f").files[0];
var n=document.getElementById("n").value;
var t=document.getElementById("t").value;
var d=document.getElementById("d").value; // TENGANI DESCRIPTION
if(!n||!t||!d||!file){alert("Lembani Zonse: Dzina, Title, Description ndi Nyimbo");return}
document.getElementById("s").innerText="Ikukweza...⏳";

var defaultCover = "https://i.imgur.com/2106523956891220.jpg";

var fd=new FormData();
fd.append("file",file);
fd.append("upload_preset","music_app");
fd.append("resource_type","auto");

fetch("https://api.cloudinary.com/v1_1/o1pg5jvm/auto/upload",{method:"POST",body:fd})
.then(res=>res.json()).then(data=>{
saveSong(t,data.secure_url,n,d,defaultCover,new Date().toLocaleDateString("en-GB"));
}).catch(err=>alert("VUTO: "+err));
}

function saveSong(name,url,user,desc,cover,date){
db.ref("songs").push({name:name,url:url,user:user,desc:desc,cover:cover,likes:0,date:date});
alert("Yatha: "+name);document.getElementById("s").innerText="Watha! ✅";
document.getElementById("n").value="";document.getElementById("t").value="";document.getElementById("d").value="";document.getElementById("f").value="";
}

function likeSong(k){db.ref("songs/"+k+"/likes").transaction(function(c){return (c||0)+1})}
function downloadSong(url, name){var a = document.createElement('a');a.href = url;a.download = name + ".mp3";a.click();alert("Ikutsitsa: " + name);}
function copySongLink(url){navigator.clipboard.writeText(url);alert("Link ya nyimbo yakopedwa! 📋")}
function copyWebsiteLink(){navigator.clipboard.writeText("https://jereaustin04-web.github.io/JMusic/");alert("Link ya AustinMusic.com yakopedwa! 📤")}
function searchSongs(){var term = document.getElementById("search").value.toLowerCase();var filtered = allSongs.filter(s => s.name.toLowerCase().includes(term) || s.desc.toLowerCase().includes(term));displaySongs(filtered,'l');}

function displaySongs(songs,targetId){
var h="";
songs.forEach(function(x){
var coverImg = x.cover || "https://via.placeholder.com/70/1DB954/000?text=♪";
h = '<div class="song"><img class="cover" src="'+coverImg+'"><div style="flex:1"><h4>'+x.name+'</h4><div style="color:#b3b3b3;font-size:10px">👤 '+x.user+' • 📅 '+ (x.date || "") +'</div><p class="desc">'+(x.desc || "")+'</p><audio controls src="'+x.url+'"></audio><div class="audio-btns"><button class="btn-download" onclick="downloadSong(\''+x.url+'\',\''+x.name+'\')">⬇️ DL</button><button class="btn-like" onclick="likeSong(\''+x.key+'\')">❤️ '+(x.likes||0)+'</button><button class="btn-link" onclick="copySongLink(\''+x.url+'\')">🔗 Link</button><button class="btn-share" onclick="copyWebsiteLink()">📤 Share</button></div></div></div>' + h;
});
document.getElementById(targetId).innerHTML=h||"<p>Palibe nyimbo pano</p>";
}

function load(){
db.ref("songs").on("value",function(snap){
allSongs = [];snap.forEach(function(c){var x=c.val();x.key = c.key;allSongs.push(x);});
allSongs.reverse();displaySongs(allSongs,'l');
});
}
load()
</script>
</body>
</html>
